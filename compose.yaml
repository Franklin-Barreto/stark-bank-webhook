services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-starkbank}
      POSTGRES_USER: ${DB_USER:-starkbank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-starkbank}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-starkbank} -d ${DB_NAME:-starkbank}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
