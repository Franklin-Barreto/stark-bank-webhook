spring:
  application:
    name: stark-bank-webhook
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:starkbank}
    username: ${DB_USER:starkbank}
    password: ${DB_PASSWORD:starkbank}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

starkbank:
  enabled: ${STARKBANK_ENABLED:false}
  environment: ${STARKBANK_ENVIRONMENT:sandbox}
  project-id: ${STARKBANK_PROJECT_ID:}
  private-key: ${STARKBANK_PRIVATE_KEY:}
  invoice:
    run-on-startup: ${STARKBANK_INVOICE_RUN_ON_STARTUP:false}